name: Build and Deploy to S3

on:
  push:
    branches: [ main ]

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 
        uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'
          
      - name: Installing Deps
        run: npm install
          
      - name: Install Angular CLI
        run: npm install -g @angular/cli@20.2.2

      - name: Build App
        run: |
          echo "Building mdhashim.com"
          npm run build-app
          echo "Built App"
          ls -lah dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/


